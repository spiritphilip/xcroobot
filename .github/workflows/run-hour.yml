name: Run Job Bot

on:
  schedule:
    - cron: "0 * * * *"   # hourly
  workflow_dispatch:
    inputs:
      max_per_run:
        description: "Max items to post this run"
        default: "100"
      window_minutes:
        description: "Spread the posts across this many minutes"
        default: "50"

# Allow the workflow to commit posted.txt back to the repo
permissions:
  contents: write

# Never let two runs overlap (they'd fight over posted.txt / double-post)
concurrency:
  group: xcroo-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run XCROO bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-2.5-flash
          MAX_PER_RUN: ${{ github.event.inputs.max_per_run || '100' }}
          WINDOW_MINUTES: ${{ github.event.inputs.window_minutes || '50' }}
          # X/Twitter cross-post (via upload-post.com); inactive until the
          # UPLOAD_POST_API_KEY secret + a dedicated 'xcroo' profile exist.
          UPLOAD_POST_API_KEY: ${{ secrets.UPLOAD_POST_API_KEY }}
          UPLOAD_POST_USER: xcroo
          X_DAILY_CAP: "15"
          X_PER_RUN: "1"
        run: python main.py

      - name: Persist posted links (dedup memory)
        if: always()   # keep progress even if the paced run is cancelled/times out
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posted.txt posted_x.txt
          if git diff --cached --quiet; then
            echo "No new links to record."
            exit 0
          fi
          git commit -m "chore: update posted list [skip ci]"
          # posted*.txt use merge=union (.gitattributes), so rebasing our append
          # onto origin auto-combines lines instead of conflicting. Retry on races.
          for attempt in 1 2 3 4 5; do
            git fetch -q origin master
            git rebase -q origin/master || { git rebase --abort || true; echo "rebase aborted"; break; }
            if git push -q origin HEAD:master; then
              echo "Pushed on attempt $attempt"; exit 0
            fi
            echo "push race, retrying ($attempt)"; sleep 4
          done
